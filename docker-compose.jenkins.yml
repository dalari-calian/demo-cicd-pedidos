# Jenkins local para o plano B da demo (e para testar o Jenkinsfile antes).
# Sobe com: docker compose -f docker-compose.jenkins.yml up -d
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-demo
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # permite que o Jenkins use o Docker do host para rodar os agents
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
