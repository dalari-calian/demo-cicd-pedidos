# Mesmo pipeline do GitHub Actions, escrito na sintaxe do GitLab CI.
# Cada job roda em um contêiner descartavel criado pelo GitLab Runner.
image: python:3.11-slim

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# cache = dependencias reaproveitadas entre execucoes (acelera)
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

before_script:
  - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - flake8 src tests

testes:
  stage: test
  script:
    - pytest --cov=src --cov-report=term-missing --cov-report=xml
             --cov-fail-under=80 --junitxml=relatorio-testes.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  # artifacts = saidas versionadas do job, visiveis na interface do GitLab
  artifacts:
    when: always
    reports:
      junit: relatorio-testes.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - relatorio-testes.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - apt-get update && apt-get install -y --no-install-recommends zip
    - mkdir -p dist
    - zip -r "dist/pedidos-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}.zip" src README.md
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 month

deploy_producao:
  stage: deploy
  script:
    - echo "Implantando ${CI_COMMIT_TAG} no ambiente de producao..."
    - echo "Artefato usado - o mesmo gerado no stage de build (build once, deploy many)."
  environment:
    name: producao
  rules:
    # so entrega em tag de versao, e ainda assim com aprovacao humana:
    # isto e ENTREGA continua, nao implantacao continua.
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
