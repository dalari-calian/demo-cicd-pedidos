name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: flake8 src tests
      - run: pytest --cov=src --cov-fail-under=80

  liberar:
    runs-on: ubuntu-latest
    needs: verificar
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: zip -r "pedidos-${GITHUB_REF_NAME}.zip" src README.md
      - run: gh release create "${GITHUB_REF_NAME}" *.zip --notes "Release automático."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}