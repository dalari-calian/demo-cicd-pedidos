name: CI/CD

# Quando roda: push na main, ou tag de versao
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:

  # Etapa 1: confere o codigo. Roda sempre.
  verificar:
    runs-on: ubuntu-latest        # Linux emprestado pelo GitHub
    steps:
      - uses: actions/checkout@v4         # baixa o repositorio
      - uses: actions/setup-python@v5     # instala o Python
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: flake8 src tests                    # estilo
      - run: pytest --cov=src --cov-fail-under=80   # testes + 80% cobertura

  # Etapa 2: publica a versao. Roda so em tag.
  liberar:
    runs-on: ubuntu-latest
    needs: verificar              # so roda se a etapa 1 passou
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: zip -r "pedidos-${GITHUB_REF_NAME}.zip" src README.md
      - run: gh release create "${GITHUB_REF_NAME}" *.zip --notes "Release automatico."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}