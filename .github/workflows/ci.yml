name: CI/CD

# Gatilho: todo push no main, toda tag de versao e todo pull request.
# E aqui que o webhook do Git vira execucao de pipeline.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (estilo e smells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: flake8
        run: flake8 src tests

  test:
    name: Testes + quality gate de cobertura
    runs-on: ubuntu-latest
    needs: lint            # DAG: so roda se o lint passou
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        # --cov-fail-under e o quality gate: abaixo de 80% o job falha (exit != 0)
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=80 --junitxml=relatorio-testes.xml
      - name: Publicar relatorio de diagnostico
        if: always()       # publica o relatorio mesmo quando o build quebra
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            relatorio-testes.xml
            coverage.xml

  build:
    name: Build do artefato versionado
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar
        run: |
          VERSAO="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          mkdir -p dist
          zip -r "dist/pedidos-${VERSAO}.zip" src README.md
          echo "Artefato gerado: dist/pedidos-${VERSAO}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-pedidos
          path: dist/*.zip

  release:
    name: Release continuo (somente em tag)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacote-pedidos
          path: dist
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Pedidos ${GITHUB_REF_NAME}" \
            --notes "Release gerado automaticamente pelo pipeline."
      - name: Deploy (simulado)
        run: |
          echo "Implantando ${GITHUB_REF_NAME} no ambiente..."
          echo "Rollback = reimplantar a tag anterior, que continua publicada."
